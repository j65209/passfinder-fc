<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="패스파인더 FC">
<meta name="theme-color" content="#0A0E1A">
<title>패스파인더 FC</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect fill='%2300FF88' width='180' height='180' rx='40'/%3E%3Ctext x='50%25' y='52%25' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif' font-weight='900' font-size='80' fill='%230A0E1A'%3EPF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0A0E1A;
    --bg-card: #131826;
    --bg-elevated: #1A2033;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --text: #FFFFFF;
    --text-muted: #8B92A8;
    --text-dim: #5A6178;
    --accent: #00FF88;
    --accent-dim: rgba(0,255,136,0.12);
    --warning: #FFB547;
    --warning-dim: rgba(255,181,71,0.12);
    --danger: #FF4757;
    --danger-dim: rgba(255,71,87,0.12);
    --info: #4DABFF;
    --info-dim: rgba(77,171,255,0.12);
    --toss: #0064FF;
    --kakao: #FFE812;

    --font-display: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    --font-body: 'Noto Sans KR', -apple-system, sans-serif;

    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
    --tab-height: 68px;
  }

  html, body {
    overscroll-behavior-y: contain;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 500;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(0,255,136,0.08), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(77,171,255,0.06), transparent 40%);
    -webkit-font-smoothing: antialiased;
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--tab-height) + var(--safe-bottom));
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 16px 16px 24px;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 48px;
    height: 48px;
    background: var(--accent);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -0.5px;
    transform: rotate(-3deg);
    border-radius: 4px;
  }

  .brand-text h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .brand-text .sub {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .header-meta {
    text-align: right;
  }

  .header-meta .date {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 16px;
    letter-spacing: 0.5px;
  }

  .header-meta .time {
    font-size: 9px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* BOTTOM TAB BAR */
  .bottom-tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(19, 24, 38, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 calc(8px + var(--safe-bottom));
    z-index: 100;
  }

  .tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: color 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 4px;
    min-height: 52px;
  }

  .tab svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tab:active {
    transform: scale(0.95);
  }

  .tab.active {
    color: var(--accent);
  }

  /* PANEL */
  .panel { display: none; }
  .panel.active {
    display: block;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* OVERVIEW STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .stats-grid .stat-card:first-child {
    grid-column: 1 / -1;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .stat-card:active {
    transform: scale(0.98);
    background: var(--bg-elevated);
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent-color, var(--accent));
  }

  .stat-card .label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .stat-card .value {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 38px;
    line-height: 1;
    letter-spacing: 0.5px;
  }

  .stat-card .sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    font-weight: 500;
  }

  /* MATCH CARD */
  .match-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    position: relative;
    overflow: hidden;
  }

  .match-card::before {
    content: 'NEXT MATCH';
    position: absolute;
    top: 18px;
    right: 20px;
    font-family: var(--font-body);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2.5px;
    color: var(--text-dim);
  }

  .match-dday {
    display: inline-block;
    background: var(--accent);
    color: var(--bg);
    padding: 5px 14px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 16px;
    letter-spacing: 0.5px;
    border-radius: 6px;
    margin-bottom: 14px;
  }

  .match-title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    line-height: 1.2;
  }

  .match-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
  }

  .match-meta span {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 24px 0 12px;
  }

  .section-title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.5px;
  }

  .section-meta {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.8px;
  }

  /* MEMBER ROW */
  .row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
    min-height: 64px;
  }

  .row-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }

  .position-badge {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .pos-GK { background: var(--warning-dim); color: var(--warning); }
  .pos-DF { background: var(--info-dim); color: var(--info); }
  .pos-MF { background: var(--accent-dim); color: var(--accent); }
  .pos-FW { background: var(--danger-dim); color: var(--danger); }

  .member-info {
    min-width: 0;
    flex: 1;
  }

  .member-info .name {
    font-size: 15px;
    font-weight: 700;
  }

  .member-info .meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  /* BUTTONS - 큰 터치영역 */
  .btn-group {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn {
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.1s;
    min-height: 40px;
    min-width: 44px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn:active {
    transform: scale(0.94);
  }

  .btn.active-yes {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: var(--accent);
  }

  .btn.active-maybe {
    background: var(--warning-dim);
    color: var(--warning);
    border-color: var(--warning);
  }

  .btn.active-no {
    background: var(--danger-dim);
    color: var(--danger);
    border-color: var(--danger);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 900;
  }

  .btn-toss {
    background: var(--toss);
    color: white;
    border-color: var(--toss);
    font-weight: 900;
    flex: 1;
  }

  .btn-kakao {
    background: var(--kakao);
    color: #3C1E1E;
    border-color: var(--kakao);
    font-weight: 900;
    flex: 1;
  }

  /* ATTENDANCE SUMMARY */
  .attendance-summary {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  .summary-pill {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
  }

  .summary-pill .num {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 30px;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .summary-pill .lbl {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .summary-pill.yes .num { color: var(--accent); }
  .summary-pill.maybe .num { color: var(--warning); }
  .summary-pill.no .num { color: var(--danger); }

  /* ATTENDANCE - 모바일 전용 레이아웃 */
  .attendance-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
  }

  .attendance-row-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .attendance-row-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }

  .attendance-row-buttons .btn {
    width: 100%;
  }

  /* FEES PROGRESS */
  .fees-header {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .fees-header-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .fees-month {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .fees-percent {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 0.5px;
  }

  .fees-amount {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .fees-amount .collected {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 36px;
    letter-spacing: 0.5px;
  }

  .fees-amount .total {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .progress-bar {
    height: 6px;
    background: var(--bg-elevated);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  /* FEES ROW - 모바일 전용 */
  .fees-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .fees-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .fees-row-bottom {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }

  /* TX ID */
  .tx-id {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.3px;
    margin-top: 2px;
    font-weight: 700;
  }

  .check-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 900;
  }

  .pay-method {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    font-weight: 900;
    letter-spacing: 0.8px;
    flex-shrink: 0;
  }

  .pay-method.toss {
    background: rgba(0,100,255,0.15);
    color: #4DABFF;
  }

  .pay-method.kakao {
    background: rgba(255,232,18,0.15);
    color: #FFE812;
  }

  /* ADD MEMBER */
  .add-form {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: 1fr 80px;
    gap: 8px;
  }

  .add-form input,
  .add-form select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 500;
    min-height: 44px;
  }

  .add-form input:focus,
  .add-form select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .add-form .add-form-btn {
    grid-column: 1 / -1;
    width: 100%;
    min-height: 44px;
  }

  /* DIVIDER */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
  }

  /* INFO BANNER */
  .info-banner {
    background: var(--info-dim);
    border: 1px solid rgba(77,171,255,0.3);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--info);
    line-height: 1.6;
    font-weight: 500;
  }

  .info-banner strong {
    color: var(--text);
    font-weight: 900;
    display: block;
    margin-bottom: 4px;
  }

  /* UNPAID DOT */
  .unpaid-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
  }

  /* PULL TO REFRESH 느낌의 부드러운 스크롤 */
  .panel {
    -webkit-overflow-scrolling: touch;
  }

  /* 데스크탑에서는 약간 더 넓게 */
  @media (min-width: 640px) {
    .container { padding: 24px 24px 32px; max-width: 700px; }
    .brand-text h1 { font-size: 32px; }
    .stat-card .value { font-size: 44px; }
    .match-title { font-size: 26px; }
    .match-meta { flex-direction: row; gap: 18px; }
    .stats-grid .stat-card:first-child { grid-column: auto; }
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .summary-pill .num { font-size: 36px; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="brand">
      <div class="logo">PF</div>
      <div class="brand-text">
        <h1>패스파인더 FC</h1>
        <div class="sub">PASSFINDER FC · EST. 2023</div>

  <main>

</div>

<nav class="bottom-tabs">

  <button class="tab" data-tab="attendance">

    <span>참석</span>
  </button>
  <button class="tab" data-tab="fees">

    <span>회비</span>
  </button>
  <button class="tab" data-tab="members">

    <span>팀원</span>
  </button>
</nav>

<script>
const STORAGE_KEY = 'passfinder_fc_v4';

const defaultData = {

    currentMonth: '2026-05',
    payments: {
      'm1_2026-05': { paid: true, method: 'toss', date: '2026-05-02', txId: 'TOSS-A8K2L' },
      'm2_2026-05': { paid: true, method: 'kakao', date: '2026-05-03', txId: 'KAKAO-9MN3P' },
      'm3_2026-05': { paid: false },
      'm4_2026-05': { paid: true, method: 'toss', date: '2026-05-04', txId: 'TOSS-Q7R5T' },
      'm5_2026-05': { paid: false },
      'm6_2026-05': { paid: true, method: 'toss', date: '2026-05-04', txId: 'TOSS-X3Y7Z' },
    }
  }
};

let state = loadData();

function loadData() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    return stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(defaultData));
  } catch {
    return JSON.parse(JSON.stringify(defaultData));
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch {}
}

// 햅틱 피드백 (모바일)
function haptic() {
  if (navigator.vibrate) navigator.vibrate(10);
}

function setTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tabId);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === `panel-${tabId}`);
  });
  // 탭 전환 시 스크롤 맨 위로
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    haptic();
    setTab(tab.dataset.tab);
  });
});

// 좌우 스와이프로 탭 전환
let touchStartX = 0;
let touchStartY = 0;
const tabOrder = ['overview', 'attendance', 'fees', 'members'];

document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!touchStartX) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // 가로 스와이프이고, 세로 움직임보다 클 때만
  if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) {
    const currentTab = document.querySelector('.tab.active').dataset.tab;
    const idx = tabOrder.indexOf(currentTab);
    if (dx < 0 && idx < tabOrder.length - 1) {
      haptic();
      setTab(tabOrder[idx + 1]);
    } else if (dx > 0 && idx > 0) {
      haptic();
      setTab(tabOrder[idx - 1]);
    }
  }
  touchStartX = 0;
  touchStartY = 0;
}, { passive: true });

const today = new Date();
document.getElementById('todayDate').textContent =
  `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;

function render() {
  renderOverview();
  renderAttendance();
  renderFees();
  renderMembers();
}

function renderOverview() {
  const match = state.matches[0];
  const attending = match ? Object.values(match.attendance).filter(v => v === 'yes').length : 0;
  const monthKey = state.fees.currentMonth;
  const paid = state.members.filter(m => state.fees.payments[`${m.id}_${monthKey}`]?.paid).length;
  const collected = paid * state.fees.monthlyAmount;
  const dDay = match ? Math.max(0, Math.ceil((new Date(match.date) - new Date()) / 86400000)) : 0;

  document.getElementById('panel-overview').innerHTML = `
    ${match ? `
      <div class="match-card" style="margin-bottom: 16px;">
        <div class="match-dday">D-${dDay}</div>
        <div class="match-title">${match.title}</div>
        <div class="match-meta">
          <span>📅 ${match.date} · ${match.time}</span>
          <span>📍 ${match.location}</span>
        </div>
      </div>
    ` : ''}

    <div class="stats-grid">
      <div class="stat-card" data-go="attendance" style="--accent-color: var(--accent);">
        <div class="label">이번 주 참석</div>
        <div class="value">${attending}<span style="font-size:20px;color:var(--text-dim);">/${state.members.length}</span></div>
        <div class="sub">${match ? match.date : '경기 없음'}</div>
      </div>
      <div class="stat-card" data-go="fees" style="--accent-color: var(--info);">
        <div class="label">이번 달 회비</div>
        <div class="value">${paid}<span style="font-size:20px;color:var(--text-dim);">/${state.members.length}</span></div>
        <div class="sub">${(collected/10000).toFixed(0)}만원 수금</div>
      </div>
      <div class="stat-card" data-go="members" style="--accent-color: var(--warning);">
        <div class="label">총 팀원</div>
        <div class="value">${state.members.length}</div>
        <div class="sub">활동 중</div>
      </div>
    </div>
  `;

  document.querySelectorAll('[data-go]').forEach(el => {
    el.addEventListener('click', () => {
      haptic();
      setTab(el.dataset.go);
    });
  });
}

function renderAttendance() {
  const match = state.matches[0];
  if (!match) {
    document.getElementById('panel-attendance').innerHTML = `<div class="empty-state">예정된 경기가 없습니다.</div>`;
    return;
  }

  const counts = { yes: 0, no: 0, maybe: 0, none: 0 };
  state.members.forEach(m => {
    const v = match.attendance[m.id] || 'none';
    counts[v]++;
  });

  document.getElementById('panel-attendance').innerHTML = `
    <div class="match-card" style="margin-bottom: 16px;">
      <div class="match-title">${match.title}</div>
      <div class="match-meta">
        <span>📅 ${match.date} ${match.time}</span>
        <span>📍 ${match.location}</span>
      </div>
    </div>

    <div class="attendance-summary">
      <div class="summary-pill yes">
        <div class="num">${counts.yes}</div>
        <div class="lbl">참석</div>
      </div>
      <div class="summary-pill maybe">
        <div class="num">${counts.maybe}</div>
        <div class="lbl">미정</div>
      </div>
      <div class="summary-pill no">
        <div class="num">${counts.no}</div>
        <div class="lbl">불참</div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title">팀원 투표</div>
      <div class="section-meta">탭하여 변경</div>
    </div>

    ${state.members.map(m => {
      const vote = match.attendance[m.id] || 'none';
      return `
        <div class="attendance-row">
          <div class="attendance-row-top">
            <div class="position-badge pos-${m.position}">${m.position}</div>
            <div class="member-info">
              <div class="name">${m.name}</div>
              <div class="meta">${m.joined} 가입</div>
            </div>
          </div>
          <div class="attendance-row-buttons">
            <button class="btn ${vote === 'yes' ? 'active-yes' : ''}" data-vote="${m.id}:yes">참석</button>
            <button class="btn ${vote === 'maybe' ? 'active-maybe' : ''}" data-vote="${m.id}:maybe">미정</button>
            <button class="btn ${vote === 'no' ? 'active-no' : ''}" data-vote="${m.id}:no">불참</button>
          </div>
        </div>
      `;
    }).join('')}
  `;

  document.querySelectorAll('[data-vote]').forEach(btn => {
    btn.addEventListener('click', () => {
      haptic();
      const [memberId, vote] = btn.dataset.vote.split(':');
      state.matches[0].attendance[memberId] = vote;
      saveData();
      render();
    });
  });
}

function renderFees() {
  const monthKey = state.fees.currentMonth;
  const paidMembers = state.members.filter(m => state.fees.payments[`${m.id}_${monthKey}`]?.paid);
  const unpaidMembers = state.members.filter(m => !state.fees.payments[`${m.id}_${monthKey}`]?.paid);
  const collected = paidMembers.length * state.fees.monthlyAmount;
  const expected = state.members.length * state.fees.monthlyAmount;
  const percent = expected > 0 ? Math.round((collected / expected) * 100) : 0;

  document.getElementById('panel-fees').innerHTML = `
    <div class="info-banner">
      <strong>💡 데모 모드</strong>
      토스 / 카카오 버튼을 누르면 결제 시뮬레이션이 실행됩니다.
    </div>

    <div class="fees-header">
      <div class="fees-header-top">
        <div class="fees-month">${monthKey} · 1인 ${(state.fees.monthlyAmount/10000).toFixed(0)}만원</div>
        <div class="fees-percent">${percent}%</div>
      </div>
      <div class="fees-amount">
        <div class="collected">${collected.toLocaleString()}원</div>
        <div class="total">/ ${expected.toLocaleString()}원</div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${percent}%"></div>
      </div>
    </div>

    ${unpaidMembers.length > 0 ? `
      <div class="section-header">
        <div class="section-title">미납 (${unpaidMembers.length}명)</div>
      </div>
      ${unpaidMembers.map(m => `
        <div class="fees-row">
          <div class="fees-row-top">
            <div class="row-left">
              <div class="unpaid-dot"></div>
              <div class="member-info">
                <div class="name">${m.name}</div>
                <div class="meta">${m.position} · 미납</div>
              </div>
            </div>
          </div>
          <div class="fees-row-bottom">
            <button class="btn btn-toss" data-pay="${m.id}:toss">토스로 받기</button>
            <button class="btn btn-kakao" data-pay="${m.id}:kakao">카카오로 받기</button>
          </div>
        </div>
      `).join('')}
      <div class="divider"></div>
    ` : ''}

    ${paidMembers.length > 0 ? `
      <div class="section-header">
        <div class="section-title">납부 완료 (${paidMembers.length}명)</div>
      </div>
      ${paidMembers.map(m => {
        const p = state.fees.payments[`${m.id}_${monthKey}`];
        return `
          <div class="row">
            <div class="row-left">
              <div class="check-icon">✓</div>
              <div class="member-info">
                <div class="name">${m.name}</div>
                <div class="tx-id">${p.txId}</div>
              </div>
            </div>
            <div class="btn-group">
              <span class="pay-method ${p.method}">${p.method === 'toss' ? 'TOSS' : 'KAKAO'}</span>
              <button class="btn" data-undo="${m.id}">취소</button>
            </div>
          </div>
        `;
      }).join('')}
    ` : ''}
  `;

  document.querySelectorAll('[data-pay]').forEach(btn => {
    btn.addEventListener('click', () => {
      haptic();
      const [memberId, method] = btn.dataset.pay.split(':');
      const prefix = method === 'toss' ? 'TOSS' : 'KAKAO';
      const txId = `${prefix}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;
      state.fees.payments[`${memberId}_${monthKey}`] = {
        paid: true, method,
        date: new Date().toISOString().slice(0,10),
        txId
      };
      saveData();
      render();
    });
  });

  document.querySelectorAll('[data-undo]').forEach(btn => {
    btn.addEventListener('click', () => {
      haptic();
      const memberId = btn.dataset.undo;
      state.fees.payments[`${memberId}_${monthKey}`] = { paid: false };
      saveData();
      render();
    });
  });
}

function renderMembers() {
  document.getElementById('panel-members').innerHTML = `
    <div class="section-header">
      <div class="section-title">팀원 ${state.members.length}명</div>
      <button class="btn btn-primary" id="toggleAdd">+ 추가</button>
    </div>

    <div id="addFormContainer"></div>

    ${state.members.map(m => `
      <div class="row">
        <div class="row-left">
          <div class="position-badge pos-${m.position}">${m.position}</div>
          <div class="member-info">
            <div class="name">${m.name}</div>
            <div class="meta">${m.joined} 가입</div>
          </div>
        </div>
        <button class="btn" data-remove="${m.id}">삭제</button>
      </div>
    `).join('')}
  `;

  let showingAdd = false;
  document.getElementById('toggleAdd').addEventListener('click', (e) => {
    haptic();
    showingAdd = !showingAdd;
    const container = document.getElementById('addFormContainer');
    if (showingAdd) {
      container.innerHTML = `
        <div class="add-form">
          <input type="text" id="newName" placeholder="이름" autocomplete="off">
          <select id="newPosition">
            <option value="GK">GK</option>
            <option value="DF">DF</option>
            <option value="MF" selected>MF</option>
            <option value="FW">FW</option>
          </select>
          <button class="btn btn-primary add-form-btn" id="confirmAdd">추가하기</button>
        </div>
      `;
      document.getElementById('newName').focus();
      document.getElementById('newName').addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') addMember();
      });
      document.getElementById('confirmAdd').addEventListener('click', addMember);
      e.target.textContent = '취소';
    } else {
      container.innerHTML = '';
      e.target.textContent = '+ 추가';
    }
  });

  function addMember() {
    const name = document.getElementById('newName').value.trim();
    const position = document.getElementById('newPosition').value;
    if (!name) return;
    haptic();
    state.members.push({
      id: `m${Date.now()}`,
      name, position,
      joined: new Date().toISOString().slice(0,7)
    });
    saveData();
    render();
  }

  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      haptic();
      const id = btn.dataset.remove;
      state.members = state.members.filter(m => m.id !== id);
      saveData();
      render();
    });
  });
}

render();
</script>
</body>
</html>
