<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="패스파인더 FC">
<meta name="theme-color" content="#0A0E1A">
<title>패스파인더 FC</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect fill='%2300FF88' width='180' height='180' rx='40'/%3E%3Ctext x='50%25' y='52%25' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif' font-weight='900' font-size='80' fill='%230A0E1A'%3EPF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0A0E1A;
    --bg-card: #131826;
    --bg-elevated: #1A2033;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --text: #FFFFFF;
    --text-muted: #8B92A8;
    --text-dim: #5A6178;
    --accent: #00FF88;
    --accent-dim: rgba(0,255,136,0.12);
    --warning: #FFB547;
    --warning-dim: rgba(255,181,71,0.12);
    --danger: #FF4757;
    --danger-dim: rgba(255,71,87,0.12);
    --info: #4DABFF;
    --info-dim: rgba(77,171,255,0.12);
    --toss: #0064FF;
    --kakao: #FFE812;

    --font-display: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    --font-body: 'Noto Sans KR', -apple-system, sans-serif;

    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
    --tab-height: 68px;
  }

  html, body {
    overscroll-behavior-y: contain;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 500;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(0,255,136,0.08), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(77,171,255,0.06), transparent 40%);
    -webkit-font-smoothing: antialiased;
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--tab-height) + var(--safe-bottom));
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 16px 16px 24px;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 48px;
    height: 48px;
    background: var(--accent);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -0.5px;
    transform: rotate(-3deg);
    border-radius: 4px;
  }

  .brand-text h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .brand-text .sub {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .header-meta {
    text-align: right;
  }

  .header-meta .date {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 16px;
    letter-spacing: 0.5px;
  }

  .header-meta .time {
    font-size: 9px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* BOTTOM TAB BAR */
  .bottom-tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(19, 24, 38, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 calc(8px + var(--safe-bottom));
    z-index: 100;
  }

  .tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: color 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 4px;
    min-height: 52px;
  }

  .tab svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tab:active {
    transform: scale(0.95);
  }

  .tab.active {
    color: var(--accent);
  }

  /* PANEL */
  .panel { display: none; }
  .panel.active {
    display: block;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* OVERVIEW STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .stats-grid .stat-card:first-child {
    grid-column: 1 / -1;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .stat-card:active {
    transform: scale(0.98);
    background: var(--bg-elevated);
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent-color, var(--accent));
  }

  .stat-card .label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .stat-card .value {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 38px;
    line-height: 1;
    letter-spacing: 0.5px;
  }

  .stat-card .sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    font-weight: 500;
  }

  /* MATCH CARD */
  .match-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    position: relative;
    overflow: hidden;
  }

  .match-card::before {
    content: 'NEXT MATCH';
    position: absolute;
    top: 18px;
    right: 20px;
    font-family: var(--font-body);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2.5px;
    color: var(--text-dim);
  }

  .match-dday {
    display: inline-block;
    background: var(--accent);
    color: var(--bg);
    padding: 5px 14px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 16px;
    letter-spacing: 0.5px;
    border-radius: 6px;
    margin-bottom: 14px;
  }

  .match-title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    line-height: 1.2;
  }

  .match-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
  }

  .match-meta span {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 24px 0 12px;
  }

  .section-title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.5px;
  }

  .section-meta {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.8px;
  }

  /* MEMBER ROW */
  .row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
    min-height: 64px;
  }

  .row-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }

  .position-badge {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .pos-GK { background: var(--warning-dim); color: var(--warning); }
  .pos-DF { background: var(--info-dim); color: var(--info); }
  .pos-MF { background: var(--accent-dim); color: var(--accent); }
  .pos-FW { background: var(--danger-dim); color: var(--danger); }

  .member-info {
    min-width: 0;
    flex: 1;
  }

  .member-info .name {
    font-size: 15px;
    font-weight: 700;
  }

  .member-info .meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  /* BUTTONS - 큰 터치영역 */
  .btn-group {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn {
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.1s;
    min-height: 40px;
    min-width: 44px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn:active {
    transform: scale(0.94);
  }

  .btn.active-yes {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: var(--accent);
  }

  .btn.active-maybe {
    background: var(--warning-dim);
    color: var(--warning);
    border-color: var(--warning);
  }

  .btn.active-no {
    background: var(--danger-dim);
    color: var(--danger);
    border-color: var(--danger);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 900;
  }

  .btn-toss {
    background: var(--toss);
    color: white;
    border-color: var(--toss);
    font-weight: 900;
    flex: 1;
  }

  .btn-kakao {
    background: var(--kakao);
    color: #3C1E1E;
    border-color: var(--kakao);
    font-weight: 900;
    flex: 1;
  }

  /* ATTENDANCE SUMMARY */
  .attendance-summary {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  .summary-pill {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
  }

  .summary-pill .num {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 30px;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .summary-pill .lbl {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .summary-pill.yes .num { color: var(--accent); }
  .summary-pill.maybe .num { color: var(--warning); }
  .summary-pill.no .num { color: var(--danger); }

  /* ATTENDANCE - 모바일 전용 레이아웃 */
  .attendance-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
  }

  .attendance-row-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .attendance-row-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }

  .attendance-row-buttons .btn {
    width: 100%;
  }

  /* FEES PROGRESS */
  .fees-header {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .fees-header-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .fees-month {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .fees-percent {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 0.5px;
  }

  .fees-amount {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .fees-amount .collected {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 36px;
    letter-spacing: 0.5px;
  }

  .fees-amount .total {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .progress-bar {
    height: 6px;
    background: var(--bg-elevated);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  /* FEES ROW - 모바일 전용 */
  .fees-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .fees-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .fees-row-bottom {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }

  /* TX ID */
  .tx-id {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.3px;
    margin-top: 2px;
    font-weight: 700;
  }

  .check-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 900;
  }

  .pay-method {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    font-weight: 900;
    letter-spacing: 0.8px;
    flex-shrink: 0;
  }

  .pay-method.toss {
    background: rgba(0,100,255,0.15);
    color: #4DABFF;
  }

  .pay-method.kakao {
    background: rgba(255,232,18,0.15);
    color: #FFE812;
  }

  /* ADD MEMBER */
  .add-form {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .add-form input,
  .add-form select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 500;
    min-height: 44px;
    width: 100%;
    box-sizing: border-box;
    -webkit-appearance: none;
    appearance: none;
  }
  .add-form select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238B92A8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 40px;
  }

  .add-form input:focus,
  .add-form select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .add-form .add-form-btn {
    width: 100%;
    min-height: 44px;
    margin-top: 4px;
  }

  /* DIVIDER */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
  }

  /* INFO BANNER */
  .info-banner {
    background: var(--info-dim);
    border: 1px solid rgba(77,171,255,0.3);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--info);
    line-height: 1.6;
    font-weight: 500;
  }

  .info-banner strong {
    color: var(--text);
    font-weight: 900;
    display: block;
    margin-bottom: 4px;
  }

  /* UNPAID DOT */
  .unpaid-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
  }

  /* PULL TO REFRESH 느낌의 부드러운 스크롤 */
  .panel {
    -webkit-overflow-scrolling: touch;
  }

  /* 데스크탑에서는 약간 더 넓게 */
  @media (min-width: 640px) {
    .container { padding: 24px 24px 32px; max-width: 700px; }
    .brand-text h1 { font-size: 32px; }
    .stat-card .value { font-size: 44px; }
    .match-title { font-size: 26px; }
    .match-meta { flex-direction: row; gap: 18px; }
    .stats-grid .stat-card:first-child { grid-column: auto; }
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .summary-pill .num { font-size: 36px; }
  }

  /* === TEAMS (자동 팀 분할) === */
  .teams-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .teams-block-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    gap: 8px;
  }
  .teams-block-title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.5px;
  }
  .teams-block-meta {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .team-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .team-card.team-color-0 { border-left-color: var(--accent); }
  .team-card.team-color-1 { border-left-color: var(--info); }
  .team-card.team-color-2 { border-left-color: var(--warning); }
  .team-card.team-color-3 { border-left-color: var(--danger); }
  .team-card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .team-card-name {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .team-card.team-color-0 .team-card-name { color: var(--accent); }
  .team-card.team-color-1 .team-card-name { color: var(--info); }
  .team-card.team-color-2 .team-card-name { color: var(--warning); }
  .team-card.team-color-3 .team-card-name { color: var(--danger); }
  .team-card-count {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .team-members-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .team-member-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 36px;
  }
  .team-member-chip.is-me {
    border-color: var(--accent);
    color: var(--accent);
  }
  .team-member-chip .move-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 4px;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =============================================================
// 패스파인더 FC - Supabase 연동 + 권한 분리 버전
// =============================================================

const SUPABASE_URL = 'https://dedjxhuhxqzcigisnmvf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Qcwd-7qY0NKMs4aob2vwGw_HB8vhv_d';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ========== STATE ==========
let state = {
  user: null,            // { role: 'admin' | 'member', id, name }
  members: [],
  matches: [],
  attendance: [],
  payments: [],
  config: {
    monthly_fee: 30000,
    current_month: '',
    bank_name: '',
    bank_account_number: '',
    bank_account_holder: ''
  },
  editingMatchId: null
};

function isAdmin() { return state.user?.role === 'admin'; }
function getCurrentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function haptic() { if (navigator.vibrate) navigator.vibrate(10); }

// ========== AUTH ==========
async function getStoredAdminPin() {
  const { data } = await sb.from('app_config').select('value').eq('key', 'admin_pin').maybeSingle();
  return data?.value || null;
}

async function setupAdminPin(pin) {
  const { error } = await sb.from('app_config').upsert({ key: 'admin_pin', value: pin, updated_at: new Date().toISOString() });
  if (error) return { ok: false, msg: '실패: ' + error.message };
  localStorage.setItem('pf_admin', '1');
  state.user = { role: 'admin', id: null, name: '운영자' };
  return { ok: true };
}

async function loginAdmin(pin) {
  const stored = await getStoredAdminPin();
  if (!stored) return { ok: false, msg: '아직 PIN이 설정되지 않았어요.' };
  if (stored !== pin) return { ok: false, msg: 'PIN이 일치하지 않습니다.' };
  localStorage.setItem('pf_admin', '1');
  state.user = { role: 'admin', id: null, name: '운영자' };
  return { ok: true };
}

async function loginMember(name, phone) {
  // signup_member: 이미 있으면 ID 반환(로그인), 없으면 새로 생성(가입)
  const { data, error } = await sb.rpc('signup_member', { p_name: name, p_phone: phone });
  if (error) return { ok: false, msg: '오류: ' + error.message };
  if (!data) return { ok: false, msg: '실패. 다시 시도해주세요.' };
  state.user = { role: 'member', id: data, name };
  localStorage.setItem('pf_member', JSON.stringify({ id: data, name }));
  return { ok: true };
}

async function checkSession() {
  // 1. 운영자 세션
  if (localStorage.getItem('pf_admin') === '1') {
    state.user = { role: 'admin', id: null, name: '운영자' };
    return true;
  }
  // 2. 팀원 세션
  const stored = localStorage.getItem('pf_member');
  if (stored) {
    try {
      const m = JSON.parse(stored);
      const { data } = await sb.from('members_public').select('id, name').eq('id', m.id).maybeSingle();
      if (data) {
        state.user = { role: 'member', id: data.id, name: data.name };
        return true;
      }
    } catch {}
    localStorage.removeItem('pf_member');
  }
  return false;
}

function logout() {
  localStorage.removeItem('pf_admin');
  localStorage.removeItem('pf_member');
  state.user = null;
  showLogin();
}

// ========== DATA ==========
async function loadAll() {
  const [members, matches, attendance, payments, config] = await Promise.all([
    sb.from('members_public').select('*').order('joined'),
    sb.from('matches').select('*').order('match_date'),
    sb.from('attendance').select('*'),
    sb.from('payments').select('*'),
    sb.from('app_config').select('*')
  ]);
  state.members = members.data || [];
  state.matches = matches.data || [];
  state.attendance = attendance.data || [];
  state.payments = payments.data || [];
  if (config.data) {
    config.data.forEach(c => {
      if (c.key === 'monthly_fee') state.config.monthly_fee = parseInt(c.value);
      else if (c.key === 'current_month') state.config.current_month = c.value;
      else if (c.key === 'bank_name') state.config.bank_name = c.value;
      else if (c.key === 'bank_account_number') state.config.bank_account_number = c.value;
      else if (c.key === 'bank_account_holder') state.config.bank_account_holder = c.value;
    });
  }
  if (!state.config.current_month) state.config.current_month = getCurrentMonth();
}

function nextMatch() {
  const today = new Date().toISOString().slice(0, 10);
  return state.matches.find(m => m.match_date >= today) || state.matches[state.matches.length - 1] || null;
}
function getVote(matchId, memberId) {
  const a = state.attendance.find(x => x.match_id === matchId && x.member_id === memberId);
  return a?.vote || 'none';
}
function getPayment(memberId, month) {
  return state.payments.find(p => p.member_id === memberId && p.month === month);
}
function isPaid(memberId, month) {
  const p = getPayment(memberId, month);
  return !!(p && p.paid_at);
}

// ========== ACTIONS ==========
async function actionVote(matchId, memberId, vote) {
  if (state.user?.role === 'member' && state.user.id !== memberId) {
    alert('본인의 참석만 변경할 수 있어요.');
    return;
  }
  const { error } = await sb.from('attendance').upsert({
    match_id: matchId, member_id: memberId, vote, updated_at: new Date().toISOString()
  });
  if (error) { alert('저장 실패: ' + error.message); return; }
  await loadAll();
  render();
}

async function actionAddMember(name, phone) {
  if (!isAdmin()) { alert('운영자만 추가할 수 있어요.'); return false; }
  const { error } = await sb.from('members').insert({ name, phone, joined: new Date().toISOString().slice(0,10) });
  if (error) { alert('실패: ' + error.message); return false; }
  await loadAll();
  render();
  return true;
}

async function actionAddMatch(title, startDate, time, location, recurrence = 'none', count = 1) {
  if (!isAdmin()) { alert('운영자만 가능해요.'); return false; }
  const interval = recurrence === 'weekly' ? 7 : (recurrence === 'biweekly' ? 14 : 0);
  const total = recurrence === 'none' ? 1 : Math.max(1, Math.min(count, 52));
  const fmtLocal = (dt) => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const dates = [];
  let d = new Date(startDate + 'T00:00:00');
  for (let i = 0; i < total; i++) {
    dates.push(fmtLocal(d));
    if (interval > 0) d = new Date(d.getTime() + interval * 86400000);
  }
  const records = dates.map(date => ({
    title, match_date: date, match_time: time || null, location: location || null
  }));
  const { error } = await sb.from('matches').insert(records);
  if (error) { alert('실패: ' + error.message); return false; }
  await loadAll();
  render();
  if (records.length > 1) alert(`✅ 경기 ${records.length}개 추가됨`);
  return true;
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch {
      return false;
    }
  }
}

  const lines = [

    '',
    `미납 ${unpaid.length}명 · 1인 ${(fee/10000).toFixed(0)}만원`,

function setTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${tabId}`));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => { haptic(); setTab(tab.dataset.tab); });
});

let touchStartX = 0, touchStartY = 0;
const tabOrder = ['overview', 'attendance', 'fees', 'members'];
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!touchStartX) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) {
    const cur = document.querySelector('.tab.active')?.dataset.tab;
    const i = tabOrder.indexOf(cur);
    if (dx < 0 && i < tabOrder.length - 1) { haptic(); setTab(tabOrder[i + 1]); }
    else if (dx > 0 && i > 0) { haptic(); setTab(tabOrder[i - 1]); }
  }
  touchStartX = 0;
  touchStartY = 0;
}, { passive: true });

// ========== TEAMS (자동 분할) ==========
const TEAM_LABELS = ['A팀', 'B팀', 'C팀', 'D팀', 'E팀'];
const TEAM_GEN_INFLIGHT = new Set();

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 분배 규칙:
// 1~3명: 팀 1개 (모자라서 게임 불가지만 일단 보여줌)
// 4~11명: 6명 못 채우면 균등 2등분 (5+5, 5+6 등)
// 12~17명: 6명 팀 가능한 만큼 + 나머지가 4~5명이면 추가팀, 1~3명이면 교체 대기
// 18명+: 같은 룰 (6+6+6+나머지)
function splitIntoTeams(memberIds) {
  const shuffled = shuffleArray(memberIds);
  const n = shuffled.length;
  if (n === 0) return { teams: [], bench: [] };
  if (n < 4) return { teams: [shuffled], bench: [] };
  if (n < 12) {
    const half = Math.ceil(n / 2);
    return { teams: [shuffled.slice(0, half), shuffled.slice(half)], bench: [] };
  }
  const fullTeams = Math.floor(n / 6);
  const remainder = n - fullTeams * 6;
  const teams = [];
  for (let i = 0; i < fullTeams; i++) {
    teams.push(shuffled.slice(i * 6, (i + 1) * 6));
  }
  if (remainder >= 4) {
    teams.push(shuffled.slice(fullTeams * 6));
    return { teams, bench: [] };
  }
  if (remainder > 0) {
    return { teams, bench: shuffled.slice(fullTeams * 6) };
  }
  return { teams, bench: [] };
}

function getMatchStartTime(match) {
  if (!match || !match.match_time) return null;
  return new Date(`${match.match_date}T${match.match_time}`);
}

// 'no-time' | 'too-early' | 'open' | 'too-late'
function getTeamWindowStatus(match) {
  const start = getMatchStartTime(match);
  if (!start) return 'no-time';
  const now = new Date();
  const windowStart = new Date(start.getTime() - 20 * 60 * 1000);
  const windowEnd = new Date(start.getTime() + 4 * 60 * 60 * 1000);
  if (now < windowStart) return 'too-early';
  if (now > windowEnd) return 'too-late';
  return 'open';
}

function attendingMemberIds(matchId) {
  const memberSet = new Set(state.members.map(m => m.id));
  return state.attendance
    .filter(a => a.match_id === matchId && a.vote === 'yes' && memberSet.has(a.member_id))
    .map(a => a.member_id);
}

async function actionGenerateTeams(match, opts = {}) {
  if (TEAM_GEN_INFLIGHT.has(match.id)) return;
  const ids = attendingMemberIds(match.id);
  if (ids.length < 4) {
    if (!opts.silent) alert('참석 인원이 4명 미만이라 팀을 짤 수 없어요.');
    return;
  }
  const split = splitIntoTeams(ids);
  const prevCount = (match.teams && match.teams.shuffle_count) || 0;
  const teamsData = {
    teams: split.teams,
    bench: split.bench,
    shuffled_at: new Date().toISOString(),
    shuffle_count: prevCount + 1
  };
  TEAM_GEN_INFLIGHT.add(match.id);
  try {
    let q = sb.from('matches').update({ teams: teamsData }).eq('id', match.id);
    if (opts.onlyIfNull) q = q.is('teams', null);
    const { error } = await q;
    if (error) {
      if (!opts.silent) alert('저장 실패: ' + error.message);
      return;
    }
    await loadAll();
    render();
  } finally {
    TEAM_GEN_INFLIGHT.delete(match.id);
  }
}

async function actionMoveTeamMember(match, memberId, targetIndex) {
  if (!isAdmin()) return;
  if (!match.teams || !match.teams.teams) return;
  const data = JSON.parse(JSON.stringify(match.teams));
  data.teams = (data.teams || []).map(t => t.filter(id => id !== memberId));
  data.bench = (data.bench || []).filter(id => id !== memberId);
  if (targetIndex === -1) {
    data.bench.push(memberId);
  } else if (data.teams[targetIndex]) {
    data.teams[targetIndex].push(memberId);
  }
  const { error } = await sb.from('matches').update({ teams: data }).eq('id', match.id);
  if (error) { alert('저장 실패: ' + error.message); return; }
  await loadAll();
  render();
}

function showMovePopup(match, memberId, fromIdx) {
  const m = state.members.find(x => x.id === memberId);
  if (!m || !match.teams) return;
  const data = match.teams;
  const teamCount = (data.teams || []).length;
  const targets = [];
  for (let i = 0; i < teamCount; i++) {
    if (i === fromIdx) continue;
    targets.push({ idx: i, label: TEAM_LABELS[i] || `${i+1}팀`, count: data.teams[i].length });
  }
  if (fromIdx !== -1) {
    targets.push({ idx: -1, label: '🔄 교체 대기', count: (data.bench || []).length });
  }
  const fromLabel = fromIdx === -1 ? '교체 대기' : (TEAM_LABELS[fromIdx] || `${fromIdx+1}팀`);
  const popup = document.createElement('div');
  popup.className = 'move-popup';
  popup.innerHTML = `
    <div class="move-popup-card" onclick="event.stopPropagation()">
      <h3>${escapeHtml(m.name)} 이동</h3>
      <div class="move-current">현재: ${fromLabel}</div>
      ${targets.map(t => `
        <button class="btn move-target" data-target="${t.idx}">
          ${t.label} <span style="color:var(--text-dim);font-weight:500;margin-left:4px;">(${t.count}명)</span>
        </button>
      `).join('')}
      <button class="btn move-target move-cancel" data-target="cancel">취소</button>
    </div>
  `;
  document.body.appendChild(popup);
  popup.addEventListener('click', async (e) => {
    if (e.target === popup) { popup.remove(); return; }
    const btn = e.target.closest('[data-target]');
    if (!btn) return;
    const target = btn.dataset.target;
    popup.remove();
    if (target === 'cancel') return;
    haptic();
    await actionMoveTeamMember(match, memberId, parseInt(target));
  });
}

function renderTeamsSection(match) {
  if (!match) return '';
  const status = getTeamWindowStatus(match);
  const has = !!(match.teams && match.teams.teams && match.teams.teams.length > 0);
  const yesCount = attendingMemberIds(match.id).length;

  // 시간 윈도우 열렸고 아직 안 짜졌으면 자동 생성 (조용히, 첫 사용자만 성공)
  if (status === 'open' && !has && yesCount >= 4) {
    actionGenerateTeams(match, { silent: true, onlyIfNull: true });
  }

  if (!has) {
    if (status === 'no-time') {
      if (!isAdmin()) return '';
      return `
        <div class="teams-pending">
          <span class="pending-emoji">⚽</span>
          경기 시간이 설정되지 않아 자동 팀 짜기를 사용할 수 없어요.<br>
          <button class="btn" id="teamsManualBtn" style="margin-top:10px;">🎲 지금 팀 짜기</button>
        </div>
      `;
    }
    if (status === 'too-early') {
      const start = getMatchStartTime(match);
      const minsToWindow = Math.max(1, Math.ceil((start.getTime() - 20*60*1000 - Date.now()) / 60000));
      const hh = Math.floor(minsToWindow / 60);
      const mm = minsToWindow % 60;
      const timeStr = (hh > 0 ? `${hh}시간 ` : '') + (mm > 0 ? `${mm}분` : '');
      return `
        <div class="teams-pending">
          <span class="pending-emoji">⚽</span>
          경기 시작 <strong style="color:var(--accent);">20분 전</strong>에 팀이 자동으로 공개돼요<br>
          <span style="font-size:11px;">현재 참석 ${yesCount}명 · ${timeStr} 후 공개</span>
          ${isAdmin() ? '<br><button class="btn" id="teamsManualBtn" style="margin-top:10px;">🎲 미리 짜기 (운영자)</button>' : ''}
        </div>
      `;
    }
    if (status === 'too-late') return '';
    if (yesCount < 4) {
      return `
        <div class="teams-pending">
          <span class="pending-emoji">⚽</span>
          참석 인원이 4명 미만이라 팀을 짤 수 없어요 (현재 ${yesCount}명)
        </div>
      `;
    }
    return `
      <div class="teams-pending">
        <span class="pending-emoji">⚽</span>
        팀 짜는 중...
      </div>
    `;
  }

  const data = match.teams;
  const memberById = id => state.members.find(m => m.id === id);
  const myId = state.user?.id;
  const totalCount = (data.teams || []).reduce((s,t) => s + t.length, 0) + (data.bench || []).length;

  const renderChip = (id, ctx) => {
    const m = memberById(id);
    if (!m) return '';
    const isMe = id === myId;
    return `
      <span class="team-member-chip ${isMe ? 'is-me' : ''}">
        ${escapeHtml(m.name)}${isMe ? ' (나)' : ''}
        ${isAdmin() ? `<button class="move-btn" data-team-move="${id}|${ctx}" title="다른 팀으로">▾</button>` : ''}
      </span>
    `;
  };

  return `
    <div class="teams-block">
      <div class="teams-block-header">
        <div class="teams-block-title">⚽ 오늘의 팀 (${totalCount}명)</div>
        <div class="teams-block-meta">${data.shuffle_count > 1 ? `${data.shuffle_count}번째 섞기` : '자동 분할'}</div>
      </div>
      ${data.teams.map((team, idx) => `
        <div class="team-card team-color-${idx % 4}">
          <div class="team-card-header">
            <div class="team-card-name">${TEAM_LABELS[idx] || `${idx+1}팀`}</div>
            <div class="team-card-count">${team.length}명</div>
          </div>
          <div class="team-members-list">
            ${team.length > 0 ? team.map(id => renderChip(id, idx)).join('') : '<span style="color:var(--text-dim);font-size:12px;">비어있음</span>'}
          </div>
        </div>
      `).join('')}
      ${(data.bench && data.bench.length > 0) ? `
        <div class="team-card bench-card">
          <div class="team-card-header">
            <div class="team-card-name">🔄 교체 대기</div>
            <div class="team-card-count">${data.bench.length}명</div>
          </div>
          <div class="team-members-list">
            ${data.bench.map(id => renderChip(id, -1)).join('')}
          </div>
        </div>
      ` : ''}
      ${isAdmin() ? `
        <div class="teams-actions">
          <button class="btn" id="teamsReshuffleBtn">🔀 다시 섞기</button>
        </div>
      ` : ''}
    </div>
  `;
}

function bindTeamsHandlers(match) {
  if (!match) return;
  document.getElementById('teamsReshuffleBtn')?.addEventListener('click', async () => {
    if (!confirm('다시 섞을까요? 모든 사용자에게 새 결과가 보입니다.')) return;
    haptic();
    await actionGenerateTeams(match);

  document.getElementById('teamsManualBtn')?.addEventListener('click', async () => {

    await actionGenerateTeams(match);
  });
  document.querySelectorAll('[data-team-move]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      haptic();
      const [memberId, fromIdx] = e.currentTarget.dataset.teamMove.split('|');
      showMovePopup(match, memberId, parseInt(fromIdx));

// 카운트다운/윈도우 자동 갱신 — 60초마다 overview만 다시 그림
let __teamRefreshTimer = null;
function scheduleTeamRefresh() {
  if (__teamRefreshTimer) return;
  __teamRefreshTimer = setInterval(() => {
    const match = nextMatch();
    if (!match) return;
    const status = getTeamWindowStatus(match);
    if (status === 'too-early' || status === 'open') {
      renderOverview();
    }
  }, 60 * 1000);
}

// ========== RENDER ==========

  if (dEl) dEl.textContent = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;

  // User badge

  renderOverview();
  renderAttendance();
  renderFees();
  renderMembers();
}

// HTML escape (XSS 방지)
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ========== LOGIN UI ==========
async function showLogin() {
  document.getElementById('appWrapper').style.display = 'none';
  document.getElementById('loginScreen').classList.add('show');

  // 운영자 PIN이 설정돼있는지 확인
  const pin = await getStoredAdminPin();
  if (!pin) {
    // 첫 운영자 등록 모드 표시
    document.querySelectorAll('.login-mode').forEach(el => el.classList.remove('active'));
    document.getElementById('setupMode').classList.add('active');
  } else {
    // 일반 로그인 모드
    document.querySelectorAll('.login-mode').forEach(el => el.classList.remove('active'));
    document.getElementById('memberMode').classList.add('active');
  }
}

function hideLogin() {
  document.getElementById('loginScreen').classList.remove('show');
  document.getElementById('appWrapper').style.display = '';
}

async function populateMemberDropdown() {
  const select = document.getElementById('loginMemberName');
  if (!select) return;
  const { data } = await sb.from('members_public').select('id, name').order('name');
  const list = data || [];
  if (list.length === 0) {
    select.innerHTML = '<option value="">등록된 팀원이 없어요</option>';
  } else {
    select.innerHTML = '<option value="">선택...</option>' +
      list.map(m => `<option value="${escapeHtml(m.name)}">${escapeHtml(m.name)}</option>`).join('');
  }
}

  render();
});

document.getElementById('setupAdminBtn').addEventListener('click', async () => {
  const pin = document.getElementById('setupPin').value;
  const confirm = document.getElementById('setupPinConfirm').value;
  if (!/^[0-9]{4,8}$/.test(pin)) { alert('PIN은 4~8자리 숫자여야 해요.'); return; }
  if (pin !== confirm) { alert('PIN 확인이 일치하지 않아요.'); return; }
  const result = await setupAdminPin(pin);
  if (!result.ok) { alert(result.msg); return; }
  hideLogin();
  await loadAll();
  render();
});

// 엔터 키로 폼 제출
['loginMemberPhone', 'adminPin', 'setupPinConfirm'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const btnId = id === 'loginMemberPhone' ? 'loginMemberBtn'
                  : id === 'adminPin' ? 'loginAdminBtn'
                  : 'setupAdminBtn';
      document.getElementById(btnId).click();
    }
  });
});

// ========== INIT ==========
async function init() {
  try {
    const ok = await checkSession();
    if (ok) {
      await loadAll();
      hideLogin();
      render();
    } else {
      await showLogin();
    }
  } catch (err) {
    console.error('초기화 실패:', err);
    alert('서버 연결 실패. 새로고침해주세요.\n' + (err.message || err));
  }
}

init();
</script>
</body>
